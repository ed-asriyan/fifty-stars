<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mark the US states and the countries you've been to. Each one gets its own shade. Saved in your browser, no sign-up.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fifty Stars">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Fifty Stars">
<meta property="og:description" content="Mark the US states and the countries you've been to.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fifty Stars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one quiet sheet of paper — map tabs and title top-left, a big counter top-right, the map as the hero, a west-to-east strip, three buttons at the bottom. */
:root{
  --bg:#ffffff;
  --ink:#131722;
  --muted:#8a8f9c;
  --land:#eceef2;
  --land-hover:#dfe2e8;
  --line:#e6e8ee;
  --mk-line:#d3d7df;
  --sheet:#ffffff;
  --scrim:rgba(19,23,34,.28);
  --focus:#2f6fdb;
  --danger:#c2402c;
  --f-display:"Overpass","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--ink:#eef0f4;--muted:#7d8494;--land:#1d222c;--land-hover:#272d39;--line:#232935;--mk-line:#353c4a;--sheet:#161a22;--scrim:rgba(0,0,0,.55);--focus:#7fa8ff;--danger:#ff7a63;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218;--ink:#eef0f4;--muted:#7d8494;--land:#1d222c;--land-hover:#272d39;--line:#232935;--mk-line:#353c4a;--sheet:#161a22;--scrim:rgba(0,0,0,.55);--focus:#7fa8ff;--danger:#ff7a63;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* The first screen is the whole app at every size: header on top, strip and buttons at the bottom, the map takes what is left and sits centred in it. */
.wrap{--pad-top:clamp(16px,3.2vh,32px);--pad-bottom:22px;max-width:1080px;margin:0 auto;padding-block:var(--pad-top) var(--pad-bottom);display:flex;flex-direction:column;gap:clamp(12px,1.9vh,18px);box-sizing:border-box}
.screen{display:flex;flex-direction:column;gap:inherit;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--pad-top) - var(--pad-bottom))}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.hl{min-width:0}
.hr{flex:none}
.tab .short{display:none}
@media (max-width:520px){.tab .long{display:none}.tab .short{display:inline}}
.tabs{display:flex;gap:2px;margin-left:-10px}
.tab{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 10px 5px;cursor:pointer;transition:background .2s,color .2s,opacity .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);background:var(--land)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* In screenshot mode the active tab reads as a plain eyebrow; the other one comes back on hover. */
body.clean .tab[aria-selected=true]{background:transparent}
body.clean .tab[aria-selected=false]{opacity:0}
body.clean header:hover .tab[aria-selected=false],body.clean .tabs:focus-within .tab{opacity:1}
h1{margin:6px 0 0;font-weight:800;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.01em;text-wrap:balance;line-height:1.05}
.count{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;line-height:.8}
.count b{font-weight:900;font-size:clamp(56px,min(12vw,11vh),120px);letter-spacing:-.04em}
.count span{font-weight:300;font-size:clamp(26px,4.4vw,46px);color:var(--muted)}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;margin-top:8px;font-variant-numeric:tabular-nums}

.map{position:relative;width:100%;flex:1 1 auto;min-height:320px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.map>svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:hidden}
.map.zoomed>svg{cursor:grab}
.map.zoomed.dragging>svg{cursor:grabbing}
.shapes.world .st{stroke-width:.6;fill-rule:evenodd}
.mk{fill:var(--mk-line);stroke:none;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none;transition:fill .45s ease}
.mk.on{stroke:var(--bg)}
.hit{fill:transparent;stroke:none;cursor:pointer}
.st{fill:var(--land);stroke:var(--bg);stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .45s ease}
@media (hover:hover){.st:hover{fill:var(--land-hover)}.st.on:hover{filter:brightness(1.06) saturate(1.05)}}
.st:focus{outline:none}
.st:focus-visible{stroke:var(--focus);stroke-width:2.2}
.lbl{font-family:var(--f-mono);font-weight:600;letter-spacing:.04em;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.ripple{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.zoomctl{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2;transition:opacity .25s}
.zbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.zbtn svg{width:18px;height:18px;display:block}
.zhint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);pointer-events:none;transition:opacity .3s}
@media (pointer:fine){.zhint{display:none}}
.map.zoomed .zhint,body.clean .zhint,.map.used .zhint{opacity:0}
.zbtn:disabled{opacity:.35;cursor:default}
.zbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
body.clean .zoomctl{opacity:0}
body.clean .map:hover .zoomctl,body.clean .zoomctl:focus-within{opacity:1}
/* Phone, portrait: the first screen is the whole app. The map takes the space that is left and sits centred in it; the list goes below. */
@media (max-width:700px) and (orientation:portrait){
  .wrap{--pad-top:14px;--pad-bottom:20px;gap:12px}
  .map{min-height:260px;width:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .zoomctl{right:max(12px,env(safe-area-inset-right,0px))}
  footer{gap:6px}
  footer .btn{padding:10px 12px 8px;gap:6px}
}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px 3px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.status{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}

.ticks{display:flex;gap:3px;height:22px}
.ticks.dense{gap:0;border-radius:3px;overflow:hidden}
.ticks.dense i{border-radius:0}
.ticks i{flex:1;min-width:0;border-radius:2px;background:var(--land);transition:background .45s ease,transform .3s ease}
.ticks i.on{transform:scaleY(1)}
.legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
.visited{font-size:13px;line-height:1.7;color:var(--muted);max-width:80ch}
.visited strong{color:var(--ink);font-weight:600}

footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-top:6px;transition:opacity .25s}
.btn[aria-busy=true]{opacity:.55;pointer-events:none}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);font:600 13px/1.3 var(--f-display);padding:10px 14px 8px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100vw - 32px);text-align:center;overflow-wrap:anywhere}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.clean footer{opacity:0}
body.clean footer:hover,body.clean footer:focus-within{opacity:1}
.btn{font:600 13px/1 var(--f-display);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 16px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn svg{width:15px;height:15px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}

/* settings sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.12);max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sheet-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sheet h2{margin:0;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>label,.sec>.k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{font:400 15px/1.4 var(--f-display);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;width:100%;box-sizing:border-box}
textarea{font-family:var(--f-mono);font-size:12px;min-height:84px;resize:vertical}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:12px;background:transparent;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font:600 12px/1 var(--f-display)}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw i{display:block;height:22px;border-radius:6px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.places{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;gap:10px;align-items:baseline}
.grp-h span{color:var(--muted);font-variant-numeric:tabular-nums}
.empty-find{font-size:13px;color:var(--muted)}
.chip{font:600 12px/1 var(--f-display);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 11px 6px;cursor:pointer}
.chips .chip[aria-pressed=true]{color:#fff;border-color:transparent}
.toggles .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app">
 <div class="screen">
  <div class="banner" id="banner" hidden>
    <span>You're looking at a shared map. Changes here aren't saved.</span>
    <span class="row">
      <button class="btn solid" id="adoptShared" type="button">Save as my map</button>
      <button class="btn" id="openMine" type="button">Open my map</button>
    </span>
  </div>
  <header>
    <div class="hl">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Map">
        <button class="tab" type="button" role="tab" data-mode="us" aria-selected="true"><span class="long">United States</span><span class="short">US</span></button>
        <button class="tab" type="button" role="tab" data-mode="world" aria-selected="false">World</button>
      </nav>
      <h1 id="title">States I've been to</h1>
    </div>
    <div class="hr">
      <div class="count" aria-live="polite"><b id="n">0</b><span>/<span id="total">50</span></span></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </header>

  <div class="map" id="map"><div class="status" id="status">Loading map…</div><div class="tip" id="tip"></div>
    <div class="zhint" id="zhint" hidden>Pinch to zoom · tap a state</div>
    <div class="zoomctl" id="zoomctl" hidden>
      <button class="zbtn" id="zIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="zbtn" id="zOut" type="button" aria-label="Zoom out" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="zbtn" id="zReset" type="button" aria-label="Show the whole map" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>
  <div class="legend" aria-hidden="true"><span>West</span><span>East</span></div>

  <footer>
    <button class="btn" id="shareLink" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
      Share link
    </button>
    <button class="btn" id="shareImage" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 15.5l4.5-4 4 3.5 3-2.5 5.5 4.5"/><circle cx="15.5" cy="9.5" r="1.5"/></svg>
      Share image
    </button>
    <button class="btn" id="openSettings" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      Settings
    </button>
  </footer>
 </div>
  <p class="visited" id="list"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet-in">
    <h2>Settings <button class="btn" id="closeSettings" type="button">Done</button></h2>

    <div class="sec">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" maxlength="60" placeholder="States I've been to">
    </div>

    <div class="sec">
      <div class="k">Palette</div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="sec">
      <div class="k">Theme</div>
      <div class="toggles" id="themes" role="group" aria-label="Theme">
        <button class="chip" type="button" data-theme-choice="auto" aria-pressed="true">Match system</button>
        <button class="chip" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button class="chip" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </div>

    <div class="sec">
      <div class="k">Display</div>
      <div class="toggles">
        <button class="chip" id="tLabels" type="button" aria-pressed="true">State codes</button>
        <button class="chip" id="tExtra" type="button" aria-pressed="false">Count D.C.</button>
        <button class="chip" id="tList" type="button" aria-pressed="true">List under map</button>
        <button class="chip" id="tClean" type="button" aria-pressed="false">Screenshot mode</button>
      </div>
      <div class="note" id="extraNote" hidden></div>
      <div class="note">Screenshot mode hides the buttons. Hover or tap the bottom of the page to bring them back.</div>
    </div>

    <div class="sec">
      <label for="placeFilter" id="placesLabel">States</label>
      <input type="text" id="placeFilter" placeholder="Find a state" autocomplete="off" spellcheck="false">
      <div class="places" id="places"></div>
    </div>

    <div class="sec">
      <div class="k">Backup</div>
      <div class="row">
        <button class="btn" id="copyBtn" type="button">Copy backup</button>
        <button class="btn" id="restoreBtn" type="button">Restore from text</button>
        <span class="note" id="dataNote"></span>
      </div>
      <textarea id="backup" placeholder='Paste a backup here, e.g. {"visited":["WA","OR","CA"]}' spellcheck="false"></textarea>
      <div class="row">
        <button class="btn warn" id="resetBtn" type="button">Clear map</button>
        <button class="btn warn" id="resetYes" type="button" hidden>Yes, clear everything</button>
        <button class="btn" id="resetNo" type="button" hidden>Keep</button>
      </div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.20/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.usa.min.js"></script>
<script>
(function(){
"use strict";
var STATES=[["AL","Alabama",1],["AK","Alaska",2],["AZ","Arizona",4],["AR","Arkansas",5],["CA","California",6],["CO","Colorado",8],["CT","Connecticut",9],["DE","Delaware",10],["DC","District of Columbia",11],["FL","Florida",12],["GA","Georgia",13],["HI","Hawaii",15],["ID","Idaho",16],["IL","Illinois",17],["IN","Indiana",18],["IA","Iowa",19],["KS","Kansas",20],["KY","Kentucky",21],["LA","Louisiana",22],["ME","Maine",23],["MD","Maryland",24],["MA","Massachusetts",25],["MI","Michigan",26],["MN","Minnesota",27],["MS","Mississippi",28],["MO","Missouri",29],["MT","Montana",30],["NE","Nebraska",31],["NV","Nevada",32],["NH","New Hampshire",33],["NJ","New Jersey",34],["NM","New Mexico",35],["NY","New York",36],["NC","North Carolina",37],["ND","North Dakota",38],["OH","Ohio",39],["OK","Oklahoma",40],["OR","Oregon",41],["PA","Pennsylvania",42],["RI","Rhode Island",44],["SC","South Carolina",45],["SD","South Dakota",46],["TN","Tennessee",47],["TX","Texas",48],["UT","Utah",49],["VT","Vermont",50],["VA","Virginia",51],["WA","Washington",53],["WV","West Virginia",54],["WI","Wisconsin",55],["WY","Wyoming",56]];
var US_NAME={},BYFIPS={};STATES.forEach(function(s){US_NAME[s[0]]=s[1];BYFIPS[s[2]]=s[0];});

var PALETTES={
  mesa:{name:"Mesa",stops:["#2f5d9e","#4aa3a2","#e9b949","#e2725b","#b0457a"]},
  pacific:{name:"Pacific",stops:["#123c8c","#2b7bba","#2fa4a0","#5cc78f","#a6dc6b"]},
  ember:{name:"Ember",stops:["#7a1f2b","#c8442d","#ef8a37","#f2b84b","#9aa84a"]},
  bloom:{name:"Bloom",stops:["#5b3fa6","#9b5fc0","#e07bb0","#f4a28c","#f6c96b"]},
  slate:{name:"Slate",stops:["#1f2a3d","#3b4d6b","#5f7697","#8aa0bd"]},
  confetti:{name:"Confetti",stops:null}
};

// Two maps share one page. Each keeps its own visited list, palette, title and total rule;
// theme and display toggles are the viewer's and apply to both.
var MODES={
  us:{id:"us",tab:"United States",eyebrow:"United States · visited",noun:"states",one:"state",title:"States I've been to",
      key:"fifty-stars:v1",extraParam:"dc",extraLabel:"Count D.C.",codesLabel:"State codes",places:"States",find:"Find a state",
      total0:50,maxK:8,labelMin:1000,grouped:false,keyboard:true,example:'{"visited":["WA","OR","CA"]}',
      aria:"Map of US states. Select a state to mark it visited. Pinch or use the zoom buttons to zoom."},
  world:{id:"world",tab:"World",eyebrow:"World · visited",noun:"countries",one:"country",title:"Countries I've been to",
      key:"fifty-stars:world:v1",extraParam:"all",extraLabel:"Count all places",codesLabel:"Country codes",places:"Countries",find:"Find a country",
      total0:195,maxK:16,labelMin:1600,grouped:true,keyboard:false,example:'{"visited":["FR","JP","MX"]}',
      note:"The total is 195: the 193 UN member states plus the two observer states, the Vatican and Palestine. Count all places also counts the other places on the map, such as Greenland, Puerto Rico, Hong Kong, Taiwan and Kosovo.",

var PREFS_KEY="fifty-stars:prefs",MODE_KEY="fifty-stars:mode";
var MARK_AREA=4;      // places smaller than this (viewBox units²) also get a dot

function hash(s,seed){var h=2166136261^seed;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%10000)/10000;}

function readJSON(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}

// ---------- state ----------
var M=MODES.us,D=null,DATA={},loading={};
var prefs,map,shared=false,lastHash="";

function known(c,mode){

}
function cleanCodes(a,mode){return (Array.isArray(a)?a:[]).map(function(c){return String(c).toUpperCase();}).filter(function(c,i,arr){return known(c,mode)&&arr.indexOf(c)===i;});}

  p=p||{};

    title:typeof p.title==="string"?p.title.slice(0,60):"",extra:!!(p.extra||(mode.id==="us"&&p.dc))};
}
function loadMap(mode){var p=readJSON(mode.key);return p&&typeof p==="object"?normMap(p,mode):null;}
function persistMap(){
  var o={visited:map.visited,palette:map.palette,title:map.title,extra:map.extra};
  if(M.id==="us")o.dc=map.extra;
  writeJSON(M.key,o);
}
function loadPrefs(){
  // Older versions kept these inside the US record.
  var p=readJSON(PREFS_KEY)||readJSON(MODES.us.key)||{};
  return {theme:["auto","light","dark"].indexOf(p.theme)>=0?p.theme:"auto",labels:p.labels!==false,list:p.list!==false,clean:!!p.clean};
}
function savePrefs(){writeJSON(PREFS_KEY,prefs);}

// Links: US    #v=WA.OR.CA&p=pacific&t=Road%20trips&dc=1
//        World #m=world&v=FR.JP&p=ember&t=Trips&all=1
function parseHash(){
  var h=location.hash.replace(/^#/,"");if(!h)return null;
  var q;try{q=new URLSearchParams(h);}catch(e){return null;}
  var mode=q.get("m")==="world"?MODES.world:(q.has("v")||q.get("m")==="us"?MODES.us:null);
  if(!mode)return null;
  var out={mode:mode,map:null};
  if(q.has("v")){var v=q.get("v")||"";out.map={visited:v?v.split(/[.,]/):[],palette:q.get("p")||"mesa",title:q.get("t")||"",extra:q.get(mode.extraParam)==="1"};}
  return out;
}
function hashFor(mode,m){
  var parts=[];
  if(mode.id!=="us")parts.push("m="+mode.id);
  parts.push("v="+m.visited.slice().sort().join("."));
  if(m.palette!=="mesa")parts.push("p="+encodeURIComponent(m.palette));
  if((m.title||"").trim())parts.push("t="+encodeURIComponent(m.title.trim()));
  if(m.extra)parts.push(mode.extraParam+"=1");
  return "#"+parts.join("&");
}
function sameSet(a,b){return a.length===b.length&&a.slice().sort().join()===b.slice().sort().join();}
function sameMap(a,b){return sameSet(a.visited,b.visited)&&a.palette===b.palette&&(a.title||"")===(b.title||"")&&a.extra===b.extra;}
function writeHash(){
  var h=hashFor(M,map);lastHash=h;
  if(location.hash===h)return;
  try{history.replaceState(null,"",location.pathname+location.search+h);}catch(e){}
}
function save(){if(!shared)persistMap();writeHash();}
function shareUrl(){return location.href.split("#")[0]+hashFor(M,map);}
function isOn(c){return map.visited.indexOf(c)>=0;}

function enterMode(mode,linked){
  M=mode;D=DATA[mode.id]||null;
  try{localStorage.setItem(MODE_KEY,mode.id);}catch(e){}
  var local=loadMap(mode);shared=false;
  map=local||normMap(null,mode);
  if(linked){
    var cand=normMap(linked,mode);
    if(!local||!local.visited.length||sameMap(local,cand)){map=cand;persistMap();}
    else{map=cand;shared=true;}
  }
  writeHash();
}
function boot(){
  prefs=loadPrefs();if(!readJSON(PREFS_KEY))savePrefs();
  var h=parseHash(),last=null;
  try{last=localStorage.getItem(MODE_KEY);}catch(e){}
  enterMode(h?h.mode:(MODES[last]||MODES.us),h&&h.map);
}

// ---------- data ----------
function loadUS(){
  var Dm=window.Datamap||window.Datamaps,topo=Dm&&Dm.prototype&&Dm.prototype.usaTopo,p;
  if(topo&&topo.objects){
    p=Promise.resolve(topojson.feature(topo,topo.objects[Object.keys(topo.objects)[0]]).features.map(function(f){return {code:String(f.id).toUpperCase(),geo:f};}));
  }else{
    p=fetch("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then(function(r){return r.json();}).then(function(t){
      return topojson.feature(t,t.objects.states).features.map(function(f){return {code:BYFIPS[+f.id],geo:f};});
    });
  }
  return p.then(function(list){
    var W=975,H=610,path=d3.geo.path().projection(d3.geo.albersUsa().scale(1300).translate([W/2,H/2])),geo={};
    list.forEach(function(f){if(US_NAME[f.code])geo[f.code]=f.geo;});
    var items=STATES.filter(function(s){return geo[s[0]];}).map(function(s){
      var code=s[0],g=geo[code],c=path.centroid(g);
      return {code:code,label:code,name:s[1],region:null,base:code!=="DC",geo:g,pt:null,cx:c[0],cy:c[1],area:path.area(g),
        lx:c[0]+(code==="FL"?14:code==="LA"?-10:code==="MI"?12:0),ly:c[1]+(code==="MI"?18:0)};
    });
    if(!items.length)throw new Error("no shapes");
    var xs=items.filter(function(i){return i.code!=="AK"&&i.code!=="HI";}).map(function(i){return i.cx;}),x0=d3.min(xs),x1=d3.max(xs);
    // Alaska and Hawaii sit in the inset corner; place them at the Pacific end of the gradient.
    items.forEach(function(i){var x=i.code==="AK"?x0-30:i.code==="HI"?x0-10:i.cx;i.t=clamp((x-x0)/(x1-x0),0,1);});
    return {W:W,H:H,path:path,items:items};
  });
}
function loadWorld(){
  return fetch("data/world.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(topo){
    var f=topo.fifty,geo={};
    topojson.feature(topo,topo.objects.countries).features.forEach(function(g){geo[g.id]=g;});
    var items=f.countries.map(function(m){
      return {code:m.id,label:m.a3,name:m.n,region:m.r,base:!!m.un,geo:geo[m.id]||null,pt:m.pt||null,cx:m.c[0],cy:m.c[1],area:m.ar,lx:m.c[0],ly:m.c[1]};
    });
    var x0=d3.min(items,function(i){return i.cx;}),x1=d3.max(items,function(i){return i.cx;});
    items.forEach(function(i){i.t=clamp((i.cx-x0)/(x1-x0),0,1);});
    return {W:f.W,H:f.H,path:d3.geo.path().projection(null),items:items};
  });
}
function ensureLoaded(mode){
  if(DATA[mode.id])return Promise.resolve(DATA[mode.id]);
  if(!loading[mode.id]){
    loading[mode.id]=(mode.id==="us"?loadUS():loadWorld()).then(function(d){
      d.byCode={};d.items.forEach(function(i){d.byCode[i.code]=i;});
      d.items.sort(function(a,b){return a.name.localeCompare(b.name);});
      DATA[mode.id]=d;return d;
    },function(e){delete loading[mode.id];throw e;});
  }
  return loading[mode.id];
}
function nameOf(c){if(D&&D.byCode[c])return D.byCode[c].name;return M.id==="us"?US_NAME[c]||c:c;}
function scopeCodes(){return D?D.items.filter(function(i){return i.base||map.extra;}).map(function(i){return i.code;}):null;}
function counts(){
  var sc=scopeCodes();
  if(!sc)return {n:map.visited.length,total:M.total0+(M.id==="us"&&map.extra?1:0),scope:null};
  return {n:map.visited.filter(function(c){return sc.indexOf(c)>=0;}).length,total:sc.length,scope:sc};
}

// ---------- colour ----------
var scales={};
function paletteScale(key){
  if(!scales[key]){var st=PALETTES[key].stops;scales[key]=d3.scale.linear().domain(st.map(function(_,i){return i/(st.length-1);})).range(st).interpolate(d3.interpolateLab);}
  return scales[key];
}
function colorFor(code){
  var info=D&&D.byCode[code];if(!info)return "#999";
  var pal=PALETTES[map.palette];
  if(!pal.stops){var hh=(info.t*300+hash(code,7)*120)%360;return d3.hsl(hh,.62,.58+(hash(code,3)-.5)*.12).toString();}
  var c=d3.hsl(paletteScale(map.palette)(clamp(info.t+(hash(code,1)-.5)*.14,0,1)));
  c.l=clamp(c.l+(hash(code,2)-.5)*.1,.18,.82);c.s=clamp(c.s+(hash(code,5)-.5)*.1,0,1);
  return c.toString();
}
function inkOn(hex){var c=d3.rgb(hex);var y=(c.r*299+c.g*587+c.b*114)/1000;return y>150?"rgba(19,23,34,.78)":"rgba(255,255,255,.92)";}

// ---------- map ----------
var mapEl=document.getElementById("map"),tip=document.getElementById("tip"),statusEl=document.getElementById("status");
var svg,gZoom,gStates,gMarks,gFx,gLabels;
function teardownMap(){
  if(svg)svg.remove();
  svg=gZoom=gStates=gMarks=gFx=gLabels=null;
  view={k:1,x:0,y:0};pts={};gesture=null;cancelAnimationFrame(zoomAnim);
  mapEl.classList.remove("zoomed","used","dragging");
  document.getElementById("zoomctl").hidden=true;document.getElementById("zhint").hidden=true;
  tip.classList.remove("show");
  statusEl.textContent="Loading map…";statusEl.hidden=false;
}
var lastPointer="mouse";
function showTip(d){
  // Touch browsers emulate a mousemove after a tap; the name would then hang over the map.
  if(lastPointer!=="mouse"||(gesture&&gesture.moved)){tip.classList.remove("show");return;}
  var r=mapEl.getBoundingClientRect(),e=d3.event;
  tip.textContent=d.name+(isOn(d.code)?" ✓":"");tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.classList.add("show");
}
function hideTip(){tip.classList.remove("show");}
function buildMap(d){
  if(d!==DATA[M.id]||svg)return;
  D=d;
  var before=map.visited.length;
  map.visited=map.visited.filter(function(c){return d.byCode[c];});
  if(map.visited.length!==before){if(!shared)persistMap();writeHash();}
  statusEl.hidden=true;
  svg=d3.select(mapEl).insert("svg",".tip").attr("viewBox","0 0 "+d.W+" "+d.H).attr("preserveAspectRatio","xMidYMid meet").attr("role","group").attr("aria-label",M.aria);
  gZoom=svg.append("g");
  gStates=gZoom.append("g").attr("class","shapes "+M.id);
  gStates.selectAll("path").data(d.items.filter(function(i){return i.geo;})).enter().append("path")
    .attr("class","st").attr("d",function(i){return d.path(i.geo);})
    .attr("tabindex",M.keyboard?0:null).attr("role",M.keyboard?"button":null)
    .attr("aria-label",function(i){return M.keyboard?i.name:null;})
    .on("keydown",function(i){var e=d3.event;if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(i.code,true);}})
    .on("mousemove",showTip).on("mouseleave",hideTip);
  // Tiny places also get a dot, so they can be seen and tapped before zooming in.
  gMarks=gZoom.append("g");
  var marks=gMarks.selectAll("g").data(d.items.filter(function(i){return !i.geo||i.area<MARK_AREA;})).enter().append("g")
    .attr("transform",function(i){var p=i.pt||[i.cx,i.cy];return "translate("+p[0]+","+p[1]+")";});
  marks.append("circle").attr("class","mk");
  marks.append("circle").attr("class","hit").on("mousemove",showTip).on("mouseleave",hideTip);
  gFx=gZoom.append("g");
  gLabels=gZoom.append("g");
  gLabels.selectAll("text").data(d.items.filter(function(i){return i.geo;})).enter().append("text")
    .attr("class","lbl").attr("x",function(i){return i.lx;}).attr("y",function(i){return i.ly;}).text(function(i){return i.label;});
  initZoom();
  buildPlaces();
  render();
}
function loadAndBuild(){
  var mode=M;
  ensureLoaded(mode).then(function(d){if(M===mode)buildMap(d);}).catch(function(err){
    if(M===mode)statusEl.textContent="Couldn't load the map shapes. Check your connection and reload.";
    console.error(err);
  });
}

// ---------- zoom and pan ----------
// The svg keeps a fixed viewBox (meet), so on a tall box the map sits centred with room around it.
// gZoom carries translate(x,y) scale(k) in viewBox units; panning may use the whole box, not just the viewBox.
var view={k:1,x:0,y:0},pts={},gesture=null,zoomAnim=0,resizeBound=false;
function toUser(cx,cy){var n=svg.node(),pt=n.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(n.getScreenCTM().inverse());}
function visRect(){var r=svg.node().getBoundingClientRect(),a=toUser(r.left,r.top),b=toUser(r.right,r.bottom);return {x0:a.x,y0:a.y,x1:b.x,y1:b.y};}
// At rest the map is centred. Zoomed in, it gets up to half a box of slack around the strict
// fit, so the point under the fingers stays put even when the map is shorter than a tall phone box.
function clampAxis(pos,size,v0,v1){
  var vs=v1-v0,c0=v0+(vs-size)/2;
  if(view.k<=1.0001)return c0;
  var free=Math.abs(vs-size)/2+(vs/2)*clamp(view.k-1,0,1);
  return clamp(pos,c0-free,c0+free);
}
function clampView(){
  var v=visRect();
  view.x=clampAxis(view.x,D.W*view.k,v.x0,v.x1);
  view.y=clampAxis(view.y,D.H*view.k,v.y0,v.y1);
}
function applyView(){
  if(!gZoom)return;
  clampView();
  gZoom.attr("transform",view.k===1&&Math.abs(view.x)<.01&&Math.abs(view.y)<.01?null:"translate("+view.x+","+view.y+") scale("+view.k+")");
  var zoomed=view.k>1.001;
  mapEl.classList.toggle("zoomed",zoomed);
  if(zoomed)mapEl.classList.add("used");
  document.getElementById("zReset").hidden=!zoomed;
  document.getElementById("zOut").disabled=!zoomed;
  document.getElementById("zIn").disabled=view.k>=M.maxK-.001;
  updateScaled();
}
function screenScale(){var ctm=svg.node().getScreenCTM();return {base:ctm?ctm.a:1,sc:(ctm?ctm.a:1)*view.k};}
function updateScaled(){
  if(!gLabels)return;
  var s=screenScale(),sc=s.sc;
  // Labels keep a steady on-screen size at any zoom and box size; a place shows its code once it can hold it.
  gLabels.style("font-size",(clamp(10.5*s.base,9,11.5)/sc)+"px");
  gLabels.selectAll("text").style("display",function(i){return i.area*sc*sc>M.labelMin?null:"none";});
  // Dots keep a steady size too, and step aside once the shape itself is big enough to tap.
  gMarks.selectAll("g").style("display",function(i){return markShown(i,sc)?null:"none";});
  gMarks.selectAll(".mk").attr("r",3.2/sc);
  gMarks.selectAll(".hit").attr("r",10/sc);
}
// A dot shows for tiny places that count towards the total (or are marked), until the shape itself is big enough.
function markShown(i,sc){return (i.base||map.extra||isOn(i.code))&&(!i.geo||i.area*sc*sc<MARK_SCREEN);}
function zoomAt(px,py,f){
  var nk=clamp(view.k*f,1,M.maxK);
  view.x=px-(px-view.x)*nk/view.k;view.y=py-(py-view.y)*nk/view.k;view.k=nk;applyView();
}
function animateZoom(targetK,px,py){
  cancelAnimationFrame(zoomAnim);

  var k0=view.k,k1=clamp(targetK,1,M.maxK),t0=performance.now(),dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:220;

function tappedCode(target){
  var d=target&&target.__data__;
  return d&&d.code&&target.classList&&(target.classList.contains("st")||target.classList.contains("hit"))?d.code:null;
}
function initZoom(){
  var node=svg.node();

  node.addEventListener("pointerdown",function(e){
    lastPointer=e.pointerType||"mouse";if(lastPointer!=="mouse")hideTip();
    if(e.pointerType==="mouse"&&e.button!==0)return;
    cancelAnimationFrame(zoomAnim);
    try{node.setPointerCapture(e.pointerId);}catch(_){}
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pts).length===1)gesture={sx:e.clientX,sy:e.clientY,t:Date.now(),moved:false,code:tappedCode(e.target)};
    else if(gesture)gesture.moved=true;

    var prev=pts[e.pointerId];if(!prev)return;
    var cur={x:e.clientX,y:e.clientY};pts[e.pointerId]=cur;
    if(gesture&&!gesture.moved&&Math.hypot(cur.x-gesture.sx,cur.y-gesture.sy)>8){gesture.moved=true;hideTip();}
    var ids=Object.keys(pts);
    if(ids.length>=2){
      var a=pts[ids[0]],b=pts[ids[1]],pa=String(e.pointerId)===ids[0]?prev:a,pb=String(e.pointerId)===ids[1]?prev:b;
      var ua=toUser(a.x,a.y),ub=toUser(b.x,b.y),qa=toUser(pa.x,pa.y),qb=toUser(pb.x,pb.y);
      var dNow=Math.hypot(ua.x-ub.x,ua.y-ub.y),dPrev=Math.hypot(qa.x-qb.x,qa.y-qb.y);
      var m={x:(ua.x+ub.x)/2,y:(ua.y+ub.y)/2},pm={x:(qa.x+qb.x)/2,y:(qa.y+qb.y)/2};
      view.x+=m.x-pm.x;view.y+=m.y-pm.y;

      var u=toUser(cur.x,cur.y),pu=toUser(prev.x,prev.y);
      view.x+=u.x-pu.x;view.y+=u.y-pu.y;applyView();

    }
  });
  function end(e){
    if(!pts[e.pointerId])return;
    delete pts[e.pointerId];

    mapEl.classList.remove("dragging");

}
document.getElementById("zIn").onclick=function(){if(svg)animateZoom(view.k*2);};
document.getElementById("zOut").onclick=function(){if(svg)animateZoom(view.k/2);};
document.getElementById("zReset").onclick=function(){if(svg)animateZoom(1);};

function ripple(code){
  if(!gFx||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  var i=D.byCode[code],p=i.geo?[i.cx,i.cy]:(i.pt||[i.cx,i.cy]),sc=screenScale().sc;
  gFx.append("circle").attr("class","ripple").attr("cx",p[0]).attr("cy",p[1]).attr("r",4/sc).style("stroke",colorFor(code)).style("opacity",.9)
    .transition().duration(700).ease("cubic-out").attr("r",46/sc).style("opacity",0).remove();
}
function toggle(code,fx){
  var k=map.visited.indexOf(code);
  if(k>=0)map.visited.splice(k,1);else{map.visited.push(code);if(fx)ripple(code);}
  save();render();
}

// ---------- theme ----------
var hostTheme=document.documentElement.getAttribute("data-theme");
function applyTheme(){
  var root=document.documentElement,t=prefs.theme;
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t);
  else if(hostTheme)root.setAttribute("data-theme",hostTheme);
  else root.removeAttribute("data-theme");
  var dark=t==="dark"||(t!=="light"&&(root.getAttribute("data-theme")==="dark"||(!root.hasAttribute("data-theme")&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)));
  var metas=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<metas.length;i++){
    if(t==="auto")metas[i].content=/dark/.test(metas[i].media)?"#0f1218":"#ffffff";
    else metas[i].content=dark?"#0f1218":"#ffffff";
  }
}

// ---------- settings: the list of places ----------
var placesEl=document.getElementById("places"),filterEl=document.getElementById("placeFilter");
function fold(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function buildPlaces(){
  placesEl.innerHTML="";filterEl.value="";
  var items=D?D.items:(M.id==="us"?STATES.map(function(s){return {code:s[0],name:s[1],region:null};}):[]);
  if(!items.length){placesEl.innerHTML='<div class="empty-find">Loading…</div>';return;}
  var groups=M.grouped?d3.nest().key(function(i){return i.region||"Other";}).sortKeys(d3.ascending).entries(items):[{key:"",values:items}];
  groups.forEach(function(g){
    var wrap=document.createElement("div");wrap.className="grp";wrap.dataset.region=g.key;
    if(g.key){var h=document.createElement("div");h.className="grp-h";h.innerHTML=g.key+' <span></span>';wrap.appendChild(h);}
    var box=document.createElement("div");box.className="chips";
    g.values.forEach(function(i){
      var b=document.createElement("button");b.type="button";b.className="chip";b.dataset.code=i.code;b.dataset.find=fold(i.name+" "+i.code+" "+(i.label||""));
      b.textContent=i.name;b.onclick=function(){toggle(i.code,false);};box.appendChild(b);
    });
    wrap.appendChild(box);placesEl.appendChild(wrap);
  });
  var none=document.createElement("div");none.className="empty-find";none.id="noFind";none.hidden=true;placesEl.appendChild(none);
}
filterEl.addEventListener("input",function(){
  var q=fold(filterEl.value.trim()),any=false;
  d3.selectAll("#places .grp").each(function(){
    var shown=0;
    d3.select(this).selectAll(".chip").each(function(){var ok=!q||this.dataset.find.indexOf(q)>=0;this.hidden=!ok;if(ok)shown++;});
    this.hidden=!shown;if(shown)any=true;
  });
  var nf=document.getElementById("noFind");if(nf){nf.hidden=any;nf.textContent="Nothing matches “"+filterEl.value.trim()+"”.";}
});

// Texts and controls that differ between the two maps.
function setupModeUI(){
  d3.selectAll("#tabs .tab").attr("aria-selected",function(){return this.dataset.mode===M.id?"true":"false";}).attr("tabindex",function(){return this.dataset.mode===M.id?0:-1;});
  document.getElementById("titleInput").placeholder=M.title;
  document.getElementById("tLabels").textContent=M.codesLabel;
  document.getElementById("tExtra").textContent=M.extraLabel;
  var note=document.getElementById("extraNote");note.textContent=M.note||"";note.hidden=!M.note;
  document.getElementById("placesLabel").textContent=M.places;
  filterEl.placeholder=M.find;
  document.getElementById("zhint").textContent="Pinch to zoom · tap a "+M.one;
  document.getElementById("backup").placeholder="Paste a backup here, e.g. "+M.example;
  buildPlaces();
}
function switchMode(id){
  if(!MODES[id]||MODES[id]===M)return;
  teardownMap();
  enterMode(MODES[id],null);
  setupModeUI();render();loadAndBuild();
  if(document.body.classList.contains("open"))document.getElementById("titleInput").value=map.title||"";
}
d3.selectAll("#tabs .tab").on("click",function(){switchMode(this.dataset.mode);}).on("keydown",function(){
  var e=d3.event;if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  e.preventDefault();var next=M.id==="us"?"world":"us";switchMode(next);
  var t=document.querySelector('#tabs .tab[data-mode="'+next+'"]');if(t)t.focus();
});

// ---------- render ----------
function render(){
  applyTheme();
  document.body.classList.toggle("clean",prefs.clean);
  document.getElementById("banner").hidden=!shared;
  var c=counts();
  document.getElementById("n").textContent=c.n;
  document.getElementById("total").textContent=c.total;
  document.getElementById("pct").textContent=Math.round(c.n/c.total*100)+"% of the map";
  var title=(map.title||"").trim()||M.title;
  document.getElementById("title").textContent=title;
  document.title=title;

  if(gStates){
    gStates.selectAll("path").classed("on",function(i){return isOn(i.code);})
      .style("fill",function(i){return isOn(i.code)?colorFor(i.code):null;})
      .attr("aria-pressed",function(i){return M.keyboard?(isOn(i.code)?"true":"false"):null;});
    gMarks.selectAll(".mk").classed("on",function(i){return isOn(i.code);}).style("fill",function(i){return isOn(i.code)?colorFor(i.code):null;});
    updateScaled();
    gLabels.style("display",prefs.labels?null:"none").selectAll("text")
      .style("fill",function(i){return isOn(i.code)?inkOn(colorFor(i.code)):"var(--muted)";})
      .style("opacity",function(i){return isOn(i.code)?1:.55;});
  }

  var order=c.scope?c.scope.slice().sort(function(a,b){var A=D.byCode[a],B=D.byCode[b];return A.t-B.t||A.cx-B.cx;}):[];
  var ticksEl=d3.select("#ticks").classed("dense",order.length>80);
  var tk=ticksEl.selectAll("i").data(order,function(d){return d;});
  tk.enter().append("i");tk.exit().remove();tk.order();
  tk.classed("on",isOn).style("background",function(d){return isOn(d)?colorFor(d):null;}).attr("title",function(d){return nameOf(d);});

  var list=document.getElementById("list"),vis=c.scope?map.visited.filter(function(x){return c.scope.indexOf(x)>=0;}):[];
  list.hidden=!prefs.list;
  list.innerHTML="";
  if(vis.length){
    var strong=document.createElement("strong");strong.textContent="Visited: ";list.appendChild(strong);
    list.appendChild(document.createTextNode(vis.map(nameOf).sort(function(a,b){return a.localeCompare(b);}).join(", ")));
  }else list.textContent="Tap any "+M.one+" to mark it. Your map is saved in this browser.";

  // settings
  d3.selectAll("#places .chip").attr("aria-pressed",function(){return isOn(this.dataset.code)?"true":"false";})
    .style("background",function(){return isOn(this.dataset.code)?colorFor(this.dataset.code):null;})
    .style("color",function(){return isOn(this.dataset.code)?inkOn(colorFor(this.dataset.code)):null;});
  if(M.grouped&&D)d3.selectAll("#places .grp").each(function(){
    var r=this.dataset.region,inR=D.items.filter(function(i){return (i.region||"Other")===r&&(i.base||map.extra);});
    var span=this.querySelector(".grp-h span");if(span)span.textContent=inR.filter(function(i){return isOn(i.code);}).length+"/"+inR.length;
  });
  d3.selectAll("#themes .chip").attr("aria-pressed",function(){return this.getAttribute("data-theme-choice")===prefs.theme?"true":"false";});
  d3.selectAll("#swatches .sw").attr("aria-pressed",function(){return this.dataset.p===map.palette?"true":"false";});
  document.getElementById("tLabels").setAttribute("aria-pressed",prefs.labels?"true":"false");
  document.getElementById("tList").setAttribute("aria-pressed",prefs.list?"true":"false");
  document.getElementById("tClean").setAttribute("aria-pressed",prefs.clean?"true":"false");
  document.getElementById("tExtra").setAttribute("aria-pressed",map.extra?"true":"false");
}

// ---------- settings sheet ----------
var body=document.body;
function openSheet(){body.classList.add("open");document.getElementById("titleInput").value=map.title||"";setTimeout(function(){document.getElementById("closeSettings").focus();},50);}
function closeSheet(){body.classList.remove("open");document.getElementById("openSettings").focus();}
document.getElementById("openSettings").onclick=openSheet;
document.getElementById("closeSettings").onclick=closeSheet;
document.getElementById("scrim").onclick=closeSheet;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&body.classList.contains("open"))closeSheet();});
document.getElementById("titleInput").addEventListener("input",function(e){map.title=e.target.value.slice(0,60);save();render();});

var sw=document.getElementById("swatches");
Object.keys(PALETTES).forEach(function(k){
  var p=PALETTES[k],b=document.createElement("button");b.type="button";b.className="sw";b.dataset.p=k;
  var grad=p.stops?"linear-gradient(90deg,"+p.stops.join(",")+")":"linear-gradient(90deg,#e45b5b,#e9b949,#5cc78f,#3d8fd6,#9b5fc0,#e07bb0)";
  b.innerHTML='<i style="background:'+grad+'"></i>'+p.name;
  b.onclick=function(){map.palette=k;save();render();};
  sw.appendChild(b);
});
d3.selectAll("#themes .chip").on("click",function(){prefs.theme=this.getAttribute("data-theme-choice");savePrefs();render();});
[["tLabels","labels"],["tList","list"],["tClean","clean"]].forEach(function(p){document.getElementById(p[0]).onclick=function(){prefs[p[1]]=!prefs[p[1]];savePrefs();render();};});
document.getElementById("tExtra").onclick=function(){map.extra=!map.extra;save();render();};

var note=document.getElementById("dataNote");
function flash(msg){note.textContent=msg;clearTimeout(flash.t);flash.t=setTimeout(function(){note.textContent="";},2600);}
document.getElementById("copyBtn").onclick=function(){
  var txt=JSON.stringify({map:M.id,visited:map.visited.slice().sort(),palette:map.palette,title:map.title||""});
  var ta=document.getElementById("backup");ta.value=txt;
  try{navigator.clipboard.writeText(txt).then(function(){flash("Copied");},function(){ta.select();flash("Select and copy the text below");});}
  catch(e){ta.select();flash("Select and copy the text below");}
};
document.getElementById("restoreBtn").onclick=function(){
  try{
    var p=JSON.parse(document.getElementById("backup").value);
    var v=Array.isArray(p)?p:p.visited;if(!Array.isArray(v))throw 0;
    if(p.map&&MODES[p.map]&&MODES[p.map]!==M){flash("That backup is for the "+MODES[p.map].tab+" map. Switch to it first.");return;}
    map.visited=cleanCodes(v,M);
    if(p.palette&&PALETTES[p.palette])map.palette=p.palette;
    if(typeof p.title==="string")map.title=p.title.slice(0,60);
    save();render();flash("Restored "+map.visited.length+" "+(map.visited.length===1?M.one:M.noun));
  }catch(e){flash("That text isn't a backup. Paste the JSON from Copy backup.");}
};
var rY=document.getElementById("resetYes"),rN=document.getElementById("resetNo"),rB=document.getElementById("resetBtn");
rB.onclick=function(){rB.hidden=true;rY.hidden=false;rN.hidden=false;};
rN.onclick=function(){rB.hidden=false;rY.hidden=true;rN.hidden=true;};
rY.onclick=function(){map.visited=[];save();render();rN.onclick();flash("Map cleared");};

// ---------- shared links ----------
document.getElementById("adoptShared").onclick=function(){shared=false;persistMap();render();toast("Saved as your map");};
document.getElementById("openMine").onclick=function(){
  map=loadMap(M)||normMap(null,M);shared=false;writeHash();render();
};
window.addEventListener("hashchange",function(){
  if(location.hash===lastHash)return;
  var h=parseHash();if(!h)return;
  if(h.mode!==M){teardownMap();enterMode(h.mode,h.map);setupModeUI();render();loadAndBuild();}
  else{enterMode(M,h.map);render();}
});

var toastEl=document.getElementById("toast");
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove("show");},2600);}
function isAbort(e){return e&&e.name==="AbortError";}
function countLine(){var c=counts();return c.n+" of "+c.total+" "+M.noun;}

document.getElementById("shareLink").onclick=function(){
  var url=shareUrl(),title=(map.title||"").trim()||M.title;
  if(navigator.share)navigator.share({title:title,text:countLine(),url:url}).catch(function(e){if(!isAbort(e))copyLink(url);});
  else copyLink(url);
};
function copyLink(url){
  try{navigator.clipboard.writeText(url).then(function(){toast("Link copied");},function(){toast(url);});}
  catch(e){toast(url);}
}

document.getElementById("shareImage").onclick=function(){
  var btn=this;if(!gStates){toast("The map is still loading");return;}
  btn.setAttribute("aria-busy","true");
  makeImage().then(function(blob){
    var name="fifty-stars-"+M.id+".png",file;
    try{file=new File([blob],name,{type:"image/png"});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:document.title,text:countLine()+" · "+shareUrl()}).catch(function(e){if(!isAbort(e))return copyOrSave(blob,name);});
    }
    return copyOrSave(blob,name);
  }).catch(function(e){console.error(e);toast("Couldn't make the image. Try again.");})
    .then(function(){btn.removeAttribute("aria-busy");});
};
function copyOrSave(blob,name){
  if(navigator.clipboard&&window.ClipboardItem){
    return navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(function(){toast("Image copied to clipboard");},function(){saveBlob(blob,name);});
  }
  saveBlob(blob,name);
}
function saveBlob(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast("Image saved");
}

// Draws a clean card of the map onto a canvas: eyebrow, title, count, map, west-to-east strip, list, link.
function makeImage(){
  var fontsReady=document.fonts&&document.fonts.load?Promise.all([
    document.fonts.load('900 120px "Overpass"'),document.fonts.load('800 40px "Overpass"'),document.fonts.load('300 40px "Overpass"'),
    document.fonts.load('400 16px "Overpass"'),document.fonts.load('600 16px "Overpass Mono"')]).catch(function(){}):Promise.resolve();
  return fontsReady.then(function(){
    var cs=getComputedStyle(document.documentElement),v=function(n){return cs.getPropertyValue(n).trim();};
    var C={bg:v("--bg"),ink:v("--ink"),muted:v("--muted"),land:v("--land"),mk:v("--mk-line")};
    var FD='"Overpass","Avenir Next","Segoe UI",system-ui,sans-serif',FM='"Overpass Mono",ui-monospace,Menlo,monospace';
    var CW=1200,pad=64,S=2,c=counts(),W=D.W,H=D.H;
    var visited=map.visited.filter(function(x){return c.scope.indexOf(x)>=0;});
    var names=visited.map(nameOf).sort(function(a,b){return a.localeCompare(b);});
    var meas=document.createElement("canvas").getContext("2d");meas.font="400 17px "+FD;
    var listLines=prefs.list&&names.length?wrapText(meas,names.join(", "),CW-pad*2):[];
    if(listLines.length>5){listLines=listLines.slice(0,5);listLines[4]=fitText(meas,listLines[4]+" …",CW-pad*2);}
    var mapTop=230,mapH=Math.round((CW-pad*2)*H/W),ticksTop=mapTop+mapH+28,listTop=ticksTop+62;
    var CH=listTop+(listLines.length?listLines.length*28+22:0)+64;
    var cv=document.createElement("canvas");cv.width=CW*S;cv.height=CH*S;
    var ctx=cv.getContext("2d");ctx.scale(S,S);
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,CW,CH);
    // header
    ctx.textBaseline="alphabetic";ctx.fillStyle=C.muted;ctx.font="600 14px "+FM;
    if("letterSpacing" in ctx)ctx.letterSpacing="2px";
    ctx.fillText(M.eyebrow.toUpperCase(),pad,96);
    if("letterSpacing" in ctx)ctx.letterSpacing="0px";
    ctx.fillStyle=C.ink;ctx.font="800 40px "+FD;
    ctx.fillText(fitText(ctx,(map.title||"").trim()||M.title,CW-pad*2-420),pad,146);
    ctx.textAlign="right";
    ctx.font="300 46px "+FD;ctx.fillStyle=C.muted;var tot="/"+c.total;ctx.fillText(tot,CW-pad,150);
    var tw=ctx.measureText(tot).width;ctx.font="900 124px "+FD;ctx.fillStyle=C.ink;ctx.fillText(String(c.n),CW-pad-tw-6,150);
    ctx.font="400 15px "+FM;ctx.fillStyle=C.muted;ctx.fillText(Math.round(c.n/c.total*100)+"% of the map",CW-pad,182);
    ctx.textAlign="left";
    // map
    var k=(CW-pad*2)/W;
    ctx.save();ctx.translate(pad,mapTop);ctx.scale(k,k);ctx.lineJoin="round";ctx.lineWidth=M.id==="world"?.55:1.1;ctx.strokeStyle=C.bg;
    D.items.forEach(function(i){if(!i.geo)return;var p=new Path2D(D.path(i.geo));ctx.fillStyle=isOn(i.code)?colorFor(i.code):C.land;ctx.fill(p,"evenodd");ctx.stroke(p);});
    D.items.forEach(function(i){
      if(i.geo&&i.area>=MARK_AREA)return;if(!markShown(i,k))return;
      var p=i.pt||[i.cx,i.cy],on=isOn(i.code);
      ctx.beginPath();ctx.arc(p[0],p[1],3.2/k,0,Math.PI*2);ctx.fillStyle=on?colorFor(i.code):C.mk;ctx.fill();
      if(on){ctx.lineWidth=1/k;ctx.strokeStyle=C.bg;ctx.stroke();}
    });
    if(prefs.labels){
      ctx.font="600 "+(10.5/k)+"px "+FM;ctx.textAlign="center";ctx.textBaseline="middle";
      D.items.forEach(function(i){if(!i.geo||i.area*k*k<=M.labelMin)return;var on=isOn(i.code);ctx.globalAlpha=on?1:.55;ctx.fillStyle=on?inkOn(colorFor(i.code)):C.muted;ctx.fillText(i.label,i.lx,i.ly+1/k);});
      ctx.globalAlpha=1;ctx.textAlign="left";ctx.textBaseline="alphabetic";
    }
    ctx.restore();
    // west-to-east strip
    var order=c.scope.slice().sort(function(a,b){var A=D.byCode[a],B=D.byCode[b];return A.t-B.t||A.cx-B.cx;});
    var dense=order.length>80,gap=dense?0:4,tw2=(CW-pad*2-gap*(order.length-1))/order.length;
    if(dense){ctx.save();roundRect(ctx,pad,ticksTop,CW-pad*2,24,3);ctx.clip();}
    order.forEach(function(x,i){ctx.fillStyle=isOn(x)?colorFor(x):C.land;
      if(dense)ctx.fillRect(pad+i*tw2,ticksTop,tw2+.5,24);else{roundRect(ctx,pad+i*(tw2+gap),ticksTop,tw2,24,2.5);ctx.fill();}});
    if(dense)ctx.restore();
    ctx.font="600 12px "+FM;ctx.fillStyle=C.muted;if("letterSpacing" in ctx)ctx.letterSpacing="1.6px";
    ctx.fillText("WEST",pad,ticksTop+46);ctx.textAlign="right";ctx.fillText("EAST",CW-pad,ticksTop+46);ctx.textAlign="left";
    if("letterSpacing" in ctx)ctx.letterSpacing="0px";
    // list
    ctx.font="400 17px "+FD;ctx.fillStyle=C.muted;
    listLines.forEach(function(line,i){ctx.fillText(line,pad,listTop+i*28+18);});
    // footer
    ctx.font="400 13px "+FM;ctx.fillStyle=C.muted;
    var host=(location.host+location.pathname).replace(/index\.html$/,"").replace(/\/$/,"");
    if(/^https?:$/.test(location.protocol)&&host)ctx.fillText(host,pad,CH-34);
    return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error("toBlob failed"));},"image/png");});
  });
}
function wrapText(ctx,text,maxW){
  var words=text.split(" "),lines=[],cur="";
  words.forEach(function(w){var t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);return lines;
}
function fitText(ctx,text,maxW){if(ctx.measureText(text).width<=maxW)return text;while(text.length>1&&ctx.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…";}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

boot();
setupModeUI();
render();
loadAndBuild();
})();
</script>
